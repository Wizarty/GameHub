<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber Snake Neo</title>
  <style>
    :root {
      --bg: #070913;
      --neon-cyan: #00f5d4;
      --neon-purple: #7b2cbf;
      --neon-pink: #f72585;
      --neon-amber: #fee440;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      padding: 8px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 520px;
      max-width: 96vw;
      padding: 10px 16px;
      background: rgba(18, 22, 38, 0.9);
      border: 1px solid rgba(0, 245, 212, 0.25);
      border-radius: 12px 12px 0 0;
      backdrop-filter: blur(10px);
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.72rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 245, 212, 0.5);
    }
    .container {
      position: relative;
      width: 520px;
      max-width: 96vw;
      height: 520px;
      max-height: 60vh;
      background: #0d111e;
      border: 2px solid rgba(0, 245, 212, 0.3);
      border-radius: 0 0 12px 12px;
      box-shadow: 0 0 35px rgba(0, 245, 212, 0.15);
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 9, 19, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(8px);
      text-align: center;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.92rem;
      line-height: 1.5;
      max-width: 380px;
    }
    button {
      background: rgba(0, 245, 212, 0.15);
      border: 1px solid var(--neon-cyan);
      color: #fff;
      padding: 11px 26px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
    }
    button:hover, button:active {
      background: var(--neon-cyan);
      color: #070913;
      box-shadow: 0 0 25px rgba(0, 245, 212, 0.7);
    }
    .kbd-tip {
      font-size: 0.8rem;
      color: #64748b;
    }

    /* On-Screen Mobile D-Pad Controls */
    .mobile-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    .dpad-row {
      display: flex;
      gap: 12px;
    }
    .dpad-btn {
      width: 52px;
      height: 48px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 245, 212, 0.3);
      color: #fff;
      border-radius: 8px;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .dpad-btn:active {
      background: var(--neon-cyan);
      color: #000;
    }
    @media (min-width: 769px) {
      .mobile-controls {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="stat">
      <span class="stat-label" id="lblScore">Score</span>
      <span class="stat-value" id="scoreVal">0</span>
    </div>
    <div class="stat" style="text-align: center;">
      <span class="stat-label" id="lblMultiplier">Multiplier</span>
      <span class="stat-value" id="comboVal" style="color: var(--neon-amber);">x1.0</span>
    </div>
    <div class="stat" style="text-align: right;">
      <span class="stat-label" id="lblHighScore">High Score</span>
      <span class="stat-value" id="highScoreVal" style="color: var(--neon-pink);">0</span>
    </div>
  </div>

  <div class="container" id="touchArea">
    <canvas id="gameCanvas" width="520" height="520"></canvas>

    <div id="startOverlay" class="overlay">
      <h1>CYBER SNAKE NEO</h1>
      <p id="snakeDesc">Collect energy cores, speed up and break records on the neon grid. Swipe or use on-screen arrows on mobile!</p>
      <button id="btnStart" onclick="startGame()">Start Game</button>
      <div class="kbd-tip" id="snakeTip">Controls: Arrow keys, WASD or Swipe gestures</div>
    </div>

    <div id="endOverlay" class="overlay hidden">
      <h1 id="endTitle" style="color: var(--neon-pink);">SYSTEM OVERFLOW</h1>
      <p id="endSub">You scored 0 points.</p>
      <button id="btnRetry" onclick="startGame()">Try Again</button>
    </div>
  </div>

  <!-- On-Screen D-Pad for Mobile & Tablets -->
  <div class="mobile-controls">
    <div class="dpad-row">
      <button class="dpad-btn" onclick="triggerDir(0, -1)">▲</button>
    </div>
    <div class="dpad-row">
      <button class="dpad-btn" onclick="triggerDir(-1, 0)">◀</button>
      <button class="dpad-btn" onclick="triggerDir(0, 1)">▼</button>
      <button class="dpad-btn" onclick="triggerDir(1, 0)">▶</button>
    </div>
  </div>

  <script>
    let currentLang = 'en';

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'ru') {
        document.getElementById('lblScore').innerText = 'Счёт';
        document.getElementById('lblMultiplier').innerText = 'Множитель';
        document.getElementById('lblHighScore').innerText = 'Рекорд';
        document.getElementById('snakeDesc').innerText = 'Собирайте энерго-ядра, ускоряйтесь и ставьте рекорды. Свайпайте или нажимайте стрелки!';
        document.getElementById('btnStart').innerText = 'Начать игру';
        document.getElementById('snakeTip').innerText = 'Управление: Стрелки, WASD, свайпы или кнопки';
        document.getElementById('btnRetry').innerText = 'Попробовать снова';
        document.getElementById('endTitle').innerText = 'СБОЙ СИСТЕМЫ';
      } else {
        document.getElementById('lblScore').innerText = 'Score';
        document.getElementById('lblMultiplier').innerText = 'Multiplier';
        document.getElementById('lblHighScore').innerText = 'High Score';
        document.getElementById('snakeDesc').innerText = 'Collect energy cores, speed up and break records on the neon grid. Swipe or use on-screen arrows on mobile!';
        document.getElementById('btnStart').innerText = 'Start Game';
        document.getElementById('snakeTip').innerText = 'Controls: Arrow keys, WASD or Swipe gestures';
        document.getElementById('btnRetry').innerText = 'Try Again';
        document.getElementById('endTitle').innerText = 'SYSTEM OVERFLOW';
      }
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'GAMEHUB_INIT_PLAYER' && e.data.lang) {
        setLanguage(e.data.lang);
      }
    });

    let audioCtx = null;
    function playSound(freq, duration = 0.08, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const touchArea = document.getElementById('touchArea');

    const GRID_SIZE = 26;
    const CELL_COUNT = 20;
    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10, type: 'normal' };
    let score = 0;
    let combo = 1;
    let highScore = localStorage.getItem('cybersnake_high') || 0;
    let gameLoopTimer = null;
    let isAlive = false;
    let particles = [];

    document.getElementById('highScoreVal').innerText = highScore;

    function triggerDir(dx, dy) {
      if (dx !== 0 && dir.x === 0) nextDir = { x: dx, y: 0 };
      if (dy !== 0 && dir.y === 0) nextDir = { x: 0, y: dy };
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: -1 };
      if (['ArrowDown', 'KeyS'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: 1 };
      if (['ArrowLeft', 'KeyA'].includes(e.code) && dir.x === 0) nextDir = { x: -1, y: 0 };
      if (['ArrowRight', 'KeyD'].includes(e.code) && dir.x === 0) nextDir = { x: 1, y: 0 };
    });

    // Touch Swipe Detection
    let touchStartX = 0;
    let touchStartY = 0;
    touchArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    touchArea.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.hypot(diffX, diffY) > 25) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
          triggerDir(diffX > 0 ? 1 : -1, 0);
        } else {
          triggerDir(0, diffY > 0 ? 1 : -1);
        }
      }
    }, { passive: true });

    function spawnFood() {
      let valid = false;
      let newX, newY;
      while (!valid) {
        newX = Math.floor(Math.random() * CELL_COUNT);
        newY = Math.floor(Math.random() * CELL_COUNT);
        valid = !snake.some(segment => segment.x === newX && segment.y === newY);
      }
      food = {
        x: newX,
        y: newY,
        type: Math.random() < 0.2 ? 'bonus' : 'normal'
      };
    }

    function spawnEatParticles(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x: x * GRID_SIZE + GRID_SIZE / 2,
          y: y * GRID_SIZE + GRID_SIZE / 2,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1,
          color
        });
      }
    }

    function startGame() {
      document.getElementById('startOverlay').classList.add('hidden');
      document.getElementById('endOverlay').classList.add('hidden');
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      combo = 1;
      updateHud();
      spawnFood();
      isAlive = true;
      if (gameLoopTimer) clearInterval(gameLoopTimer);
      gameLoopTimer = setInterval(tick, 95);
      render();
    }

    function gameOver() {
      isAlive = false;
      clearInterval(gameLoopTimer);
      playSound(150, 0.4, 'sawtooth');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cybersnake_high', highScore);
        document.getElementById('highScoreVal').innerText = highScore;
      }

      document.getElementById('endSub').innerText = `${currentLang === 'ru' ? 'Итоговый счёт' : 'Final Score'}: ${score} (${currentLang === 'ru' ? 'Рекорд' : 'High Score'}: ${highScore})`;
      document.getElementById('endOverlay').classList.remove('hidden');

      if (window.parent) {
        window.parent.postMessage({
          type: 'GAMEHUB_GAME_OVER',
          gameId: 'cyber-snake',
          score: score
        }, '*');
      }
    }

    function updateHud() {
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('comboVal').innerText = `x${combo.toFixed(1)}`;
    }

    function tick() {
      if (!isAlive) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= CELL_COUNT || head.y < 0 || head.y >= CELL_COUNT) {
        gameOver();
        return;
      }

      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        const isBonus = food.type === 'bonus';
        const gain = isBonus ? 30 : 10;
        score += Math.round(gain * combo);
        combo = Math.min(3.0, combo + 0.1);
        updateHud();
        playSound(isBonus ? 880 : 587, 0.1, 'triangle');
        spawnEatParticles(head.x, head.y, isBonus ? '#fee440' : '#00f5d4');
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= CELL_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0); ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE); ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
      const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
      ctx.save();
      ctx.shadowBlur = 15;
      ctx.shadowColor = food.type === 'bonus' ? '#fee440' : '#f72585';
      ctx.fillStyle = food.type === 'bonus' ? '#fee440' : '#f72585';
      ctx.beginPath();
      ctx.arc(fx, fy, GRID_SIZE / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      snake.forEach((seg, idx) => {
        const px = seg.x * GRID_SIZE;
        const py = seg.y * GRID_SIZE;
        ctx.save();
        if (idx === 0) {
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#00f5d4';
          ctx.fillStyle = '#00f5d4';
        } else {
          ctx.fillStyle = `rgba(0, 245, 212, ${0.9 - (idx / snake.length) * 0.5})`;
        }
        ctx.fillRect(px + 2, py + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        ctx.restore();
      });

      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) {
          particles.splice(idx, 1);
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      });

      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
